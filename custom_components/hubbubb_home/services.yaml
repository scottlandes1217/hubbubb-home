remember:
  fields:
    fact:
      required: true
      example: "the pool guy comes on tuesdays"
      selector: { text: }
recall:
  fields:
    query:
      required: true
      example: "pool"
      selector: { text: }
    limit:
      default: 3
      selector: { number: { min: 1, max: 25 } }
forget:
  fields:
    query:
      required: true
      selector: { text: }
recipe_save:
  fields:
    id:
      description: "Set to replace an existing recipe"
      selector: { number: { min: 1, mode: box } }
    title:
      required: true
      example: "Chicken parmesan"
      selector: { text: }
    ingredients:
      description: "One per line"
      selector: { text: { multiline: true } }
    steps:
      description: "One per line"
      selector: { text: { multiline: true } }
    source:
      example: "https://example.com/chicken-parm"
      selector: { text: }
recipe_delete:
  fields:
    id:
      required: true
      selector: { number: { min: 1, mode: box } }
recipe_list: {}
recipe_web:
  fields:
    query:
      required: true
      example: "chicken tikka masala"
      selector: { text: }
    limit:
      default: 5
      selector: { number: { min: 1, max: 10 } }
memory_list: {}
skills: {}
recipe_find:
  fields:
    query:
      required: true
      example: "something with chicken"
      selector: { text: }
    limit:
      default: 3
      selector: { number: { min: 1, max: 25 } }
timer_start:
  fields:
    name:
      example: "pasta"
      selector: { text: }
    hours:
      default: 0
      selector: { number: { min: 0, max: 24 } }
    minutes:
      default: 0
      selector: { number: { min: 0, max: 600 } }
    seconds:
      default: 0
      selector: { number: { min: 0, max: 600 } }
timer_cancel:
  fields:
    timer_id:
      example: "t1"
      selector: { text: }
    name:
      example: "pasta"
      selector: { text: }
timer_add:
  fields:
    timer_id:
      selector: { text: }
    name:
      selector: { text: }
    seconds:
      required: true
      selector: { number: { min: -3600, max: 3600 } }
ask_hubbubb:
  fields:
    request:
      required: true
      example: "what did the Fletchers ask for last week"
      selector: { text: }
run_sweep:
review_decide:
  name: Decide on a nightly proposal
  description: >-
    Accept, reject, or mark done one proposal from the nightly review. The
    Repairs panel does accepted on submit and rejected on ignore; done is what
    the session that applied it says afterwards.
  fields:
    id: { required: true, selector: { text: } }
    decision:
      required: true
      selector: { select: { options: [accepted, rejected, done, pending] } }
speak_briefing:
  fields:
    target:
      selector: { entity: { domain: assist_satellite } }
agent_status:
agent_transcript:
  fields:
    window: { selector: { text: } }
agent_prompt_direct:
  fields:
    text: { required: true, selector: { text: } }
agent_start_session:
  fields:
    project: { selector: { text: } }
agent_target_window:
  fields:
    id: { required: true, selector: { text: } }
agent_upload:
  fields:
    name: { selector: { text: } }
    data: { selector: { text: } }
agent_key:
  fields:
    key: { required: true, selector: { text: } }
agent_kill:
  fields:
    window: { selector: { text: } }
agent_model:
  fields:
    id: { required: true, selector: { text: } }
    model: { required: true, selector: { text: } }
agent_permission:
  fields:
    id: { required: true, selector: { text: } }
    mode: { selector: { text: } }
agent_models:
agent_file:
  fields:
    id: { selector: { text: } }
    path: { required: true, selector: { text: } }
agent_screen:
  fields:
    display: { selector: { text: } }
agent_screen_input:
  fields:
    text: { selector: { text: } }
    key: { selector: { text: } }
agent_screen_click:
  fields:
    x: { required: true, selector: { number: { min: 0, max: 1, step: 0.001 } } }
    y: { required: true, selector: { number: { min: 0, max: 1, step: 0.001 } } }
    count: { selector: { number: { min: 1, max: 2, step: 1 } } }
run_review:
  name: Run the nightly review
  description: >-
    Review yesterday's coding sessions now instead of waiting for tonight.
    Needs a companion; it runs the agent there and can take several minutes.
review_recheck:
  name: Re-check open review findings
  description: >-
    Ask the companion's agent to read the current code for every pending and
    accepted proposal, and mark the ones already fixed as done.
agent_fleet:
  fields:
    project: { selector: { text: } }
agent_fleet_act:
  fields:
    action: { required: true, selector: { select: { options: [drop, task, recall, commit, push] } } }
    project: { selector: { text: } }
    feature: { selector: { text: } }
    mission: { selector: { text: } }
    id: { selector: { text: } }
    text: { selector: { text: } }
    message: { selector: { text: } }
mac_screen_sharing:
  fields:
    "on":
      required: true
      selector: { boolean: }
gestures_enable:
  fields:
    "on":
      required: true
      selector: { boolean: }
gesture_test:
  fields:
    gesture:
      required: true
      selector:
        select:
          options: [thumbs_up, thumbs_down, open_palm, number_1, number_2, number_3]
    person: { selector: { text: } }
gestures_get:
gesture_save:
camera_state:
camera_settings:
camera_pan:
camera_enroll:
camera_forget_person:
camera_items:
camera_forget_item:
camera_learn:
camera_room_reset:
camera_look:
jarvis_presence_get:
jarvis_presence_save:
jarvis_presence_test:
  fields:
    mood:
      required: true
      selector: { select: { options: [listening, thinking, speaking] } }
camera_drag:
camera_focus:
camera_pets:
camera_pets_save:
camera_pet_spot:
camera_gesture_teach:
camera_gesture_forget:
