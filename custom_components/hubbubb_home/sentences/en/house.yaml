language: en
intents:
  # Bare forms first - the wildcard rules further down eat anything.
  HubbubbMyDay:
    data:
      - sentences:
          - "(what's|what is) (my day|on my calendar) [looking like] [today]"
          - "(what's|what is) my (day|schedule) today"
          - "(what do I have|what's) on today"
          - "(read|what's) my calendar"
  HubbubbBuildOn:
    data:
      - sentences:
          - "(build|builder|build mode) (on|screen)"
          - "(show|open) (the|) build (screen|mode)"
          - "let's build (something|)"
  HubbubbBuildOff:
    data:
      - sentences:
          - "(build|build mode) off"
          - "(close|exit|leave) (the|) build (screen|mode)"
          - "(we're|we are) done building"
  HubbubbFindings:
    data:
      - sentences:
          - "(how is|how's) the house"
          - "(is|has) anything (broken|wrong|offline|gone quiet)"
          - "what did you find (last night|overnight|)"
          - "(any|what) findings"
  HubbubbAsk:
    data:
      # Every spelling speech-to-text has for the name: "hubbub" is a real
      # English word and is what STT writes, so the canonical spelling alone
      # never matches and everything falls through to the coding agent.
      - sentences:
          - "ask (hubbubb|hubbub|hub bub) {request}"
          - "(check|ask) (hubbubb|hubbub|hub bub) (for|about) {request}"
          - "(hubbubb|hubbub|hub bub) {request}"
  # Two wildcards, so the literal "that" between them is mandatory - it is
  # what stops {room} eating the whole sentence. Last in the file.
  HubbubbIntercom:
    data:
      - sentences:
          - "tell (the |){room} that {message}"
          - "announce to (the |){room} that {message}"
          - "(tell|say to) (the |){room} to {message}"
lists:
  request:
    wildcard: true
  room:
    wildcard: true
  message:
    wildcard: true
