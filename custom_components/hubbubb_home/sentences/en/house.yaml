language: en
intents:
  # Bare forms first - the wildcard rules further down eat anything.
  # Dismissals map to HA's built-in nevermind intent, so a false wake or a
  # changed mind ends the turn locally instead of handing "nothing, cancel
  # the request" to a language model that will try to do something with it.
  HassNevermind:
    data:
      - sentences:
          - "nothing[[,] (cancel|nevermind|never mind|forget) [it|that|the request]]"
          - "cancel (that|it|the request)"
          - "(nevermind|never mind|forget it|forget that)"
          - "(no|nothing) thank you"
          - "that (was|is) (all|it|nothing)"
          - "(stop|go away|as you were)"
  HubbubbMyDay:
    data:
      - sentences:
          - "(what's|what is) (my day|on my calendar) [looking like] [today]"
          - "(what's|what is) my (day|schedule) today"
          - "(what do I have|what's) on today"
          - "(read|what's) my calendar"
  HubbubbBuildOn:
    data:
      - sentences:
          - "(build|builder|build mode) (on|screen)"
          - "(show|open) (the|) build (screen|mode)"
          - "let's build (something|)"
  HubbubbBuildOff:
    data:
      - sentences:
          - "(build|build mode) off"
          - "(close|exit|leave) (the|) build (screen|mode)"
          - "(we're|we are) done building"
  HubbubbFindings:
    data:
      - sentences:
          - "(how is|how's) the house"
          - "(is|has) anything (broken|wrong|offline|gone quiet)"
          - "what did you find (last night|overnight|)"
          - "(any|what) findings"
  HubbubbListRead:
    data:
      - sentences:
          - "(what's|what is|what do I have) on my list"
          - "read [me] my list"
      - sentences:
          - "(what's|what is) on the (shopping|house|grocery) list"
          - "read [me] the (shopping|house|grocery) list"
        slots:
          scope: house
  # The {item} wildcard is fenced by mandatory literals on both sides, so it
  # cannot eat the sentence the way a bare wildcard would.
  HubbubbListAdd:
    data:
      - sentences:
          - "(add|put) {item} (to|on) my list"
      - sentences:
          - "(add|put) {item} (to|on) the (shopping|house|grocery) list"
        slots:
          scope: house
  HubbubbListDone:
    data:
      - sentences:
          - "(cross|check|tick|take) {item} off [of] (my|the) list"
          - "mark {item} [as] done on (my|the) list"
  HubbubbAsk:
    data:
      # Every spelling speech-to-text has for the name: "hubbub" is a real
      # English word and is what STT writes, so the canonical spelling alone
      # never matches and everything falls through to the coding agent.
      - sentences:
          - "ask (hubbubb|hubbub|hub bub) {request}"
          - "(check|ask) (hubbubb|hubbub|hub bub) (for|about) {request}"
          - "(hubbubb|hubbub|hub bub) {request}"
  # Two wildcards, so the literal "that" between them is mandatory - it is
  # what stops {room} eating the whole sentence. Last in the file.
  HubbubbIntercom:
    data:
      - sentences:
          - "tell (the |){room} that {message}"
          - "announce to (the |){room} that {message}"
          - "(tell|say to) (the |){room} to {message}"
lists:
  request:
    wildcard: true
  room:
    wildcard: true
  message:
    wildcard: true
  item:
    wildcard: true
