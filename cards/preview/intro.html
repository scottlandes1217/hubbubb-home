<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis entrance preview</title>
<style>
body{margin:0;background:#030b0d;color:#b8dbd9;font:15px system-ui}main{max-width:900px;margin:24px auto;padding:16px}nav{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}button{padding:12px;background:#12363a;color:#b8dbd9;border:1px solid #36777a;border-radius:8px}#status{font-variant-numeric:tabular-nums;color:#79aca6}jarvis-intro-preview{border:1px solid #143c38;border-radius:12px;background:radial-gradient(ellipse at 50% 40%,#083d37,#020a0c 65%)}
</style>
<main><p>Jarvis · armor assembly & button entrances</p><nav><button id="boot">Replay full entrance</button><button id="speech">Play speech</button><button id="idle">Idle</button><button id="preferences">Replay preferences → power</button><button id="armor">Replay armor</button><button id="assembled">Inspect armor at 100%</button></nav><div id="stage"></div><p id="status"></p><audio id="audio"></audio></main>
<script type="module">
import '../../custom_components/hubbubb_home/www/hubbubb-ring-card.js';
import {render} from '../../node_modules/lit-html/lit-html.js';
const Card=customElements.get('hubbubb-ring-card');
// Exercise the real canvas, dock template, styles and visual timeline, with
// no HA connection, polling, announcements or services in this local preview.
class Preview extends Card {connectedCallback(){} disconnectedCallback(){} _intro(){this._startIntroVisuals();}}
customElements.define('jarvis-intro-preview',Preview);
const c=new Preview();
c._config={animation:'jarvis-im3',particle_size:.8,audio_offset:0,assistant_name:'Jarvis'};
c._hass={states:{}};c._sessions=[];c._t=c._spin=0;
c._speech={t:0,next:0,env:0,count:0,pulses:[],spikes:[]};
const root=c.attachShadow({mode:'open'});
root.innerHTML=`<style>${Card.styles.cssText}
.wrap{width:100%;--jr-color:#5fe8dc;--jr-line:63,200,190;--jr-glow:70,220,205;padding:16px 0}
#dock{width:100%}.ring{width:400px;height:400px;max-width:100%;margin:0 auto}.ring canvas{width:100%;height:100%}
</style><div class="wrap"><div class="ring"><canvas width="800" height="800"></canvas></div><div id="dock"></div></div>`;
document.querySelector('#stage').append(c);
c._ctx=root.querySelector('canvas').getContext('2d');c._ctx.scale(2,2);c._w=c._h=400;c._buildSheetField();
const audio=document.querySelector('audio');
window.jarvisPreview={cards:[c],audio};
let frozenArmor=false;
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;c._t+=dt;c._spin+=dt*.1;c._speechTick(dt);
 c._ctx.clearRect(0,0,400,400);c._drawIm3(frozenArmor?0:dt,c._ctx,200,200,200,{speech:audio.paused?0:1,bright:1.7},c._speech.env,95,232,220);
 render(c._renderDock(false),root.querySelector('#dock'),{host:c});
 document.querySelector('#status').textContent=`Intro ${(c._boot?.t||0).toFixed(2)} s · landed ${c._landed?.size??5}/5 · overlays ${c._introOverlays?.size||0} · ${c._membrane?'3D':'Canvas'}`;
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.querySelector('#boot').onclick=()=>{frozenArmor=false;c._startIntroVisuals();};
document.querySelector('#preferences').onclick=()=>{c._stopIntroVisuals();frozenArmor=false;c._boot={t:12.2};};
document.querySelector('#armor').onclick=()=>{c._stopIntroVisuals();frozenArmor=false;c._boot={t:15.0};};
document.querySelector('#assembled').onclick=()=>{c._stopIntroVisuals();frozenArmor=true;c._boot={t:17.3};};
document.querySelector('#speech').onclick=async()=>{audio.src='./speech.mp3';c._trackSpeech(audio,audio.src);audio.onended=()=>c._releaseSpeech(audio);await audio.play();};
document.querySelector('#idle').onclick=()=>{frozenArmor=false;audio.pause();c._releaseSpeech(audio);c._stopIntroVisuals();};
window.addEventListener('error',e=>document.querySelector('#status').textContent=e.message);
</script></html>
