<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jarvis membrane preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050d10;color:#b8dbd9;font:15px system-ui}main{max-width:1000px;margin:35px auto;padding:20px}h1{font-size:24px;font-weight:500}p{color:#7eaaa8}.stage{display:flex;gap:28px;align-items:center;justify-content:center}.ring{width:402px;max-width:100%;background:radial-gradient(ellipse at 50% 55%,#0b3035, #061316 60%,#030a0d);border:1px solid #174144;border-radius:16px}canvas{display:block;width:100%;height:auto}button,label{font:inherit;background:#0d2b30;border:1px solid #276169;color:#b7e8e0;padding:10px 14px;border-radius:8px;cursor:pointer}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input{display:none}#meter{height:3px;background:#5fe8dc;width:0}#status{font-variant-numeric:tabular-nums;font-size:13px;color:#84b8b3}@media(max-width:700px){.stage{flex-direction:column}}.small{width:240px}h2{text-align:center;font-size:12px;font-weight:500;letter-spacing:.12em;color:#70a5a2}
</style>
<main><h1>Jarvis · voice & membranes</h1><p>Original sphere, two translucent bubble surfaces. Play an audio file to check the folds against its actual waveform.</p><nav><button id="speech">Play speech sample</button><label>Choose audio<input id="file" type="file" accept="audio/*"></label><button id="pause">Pause / resume</button><button id="boot">Startup animation</button><button id="idle">Idle</button><button id="sessions">Toggle sample sessions</button></nav><div class="stage"><div class="ring"><h2>DASHBOARD · 400 PX</h2><canvas width="800" height="800"></canvas></div><div class="ring small"><h2>COMPACT · 240 PX</h2><canvas width="480" height="480"></canvas></div></div><div id="meter"></div><p id="status">Loading…</p><audio id="audio"></audio></main>
<script type="module">
import '../../custom_components/hubbubb_home/www/hubbubb-ring-card.js';
const Card=customElements.get('hubbubb-ring-card'), audio=document.querySelector('audio');
const cards=[...document.querySelectorAll('canvas')].map(canvas=>{
 const c=new Card();
 c._config={animation:'jarvis-im3',particle_size:.8,audio_offset:0};
 c._ctx=canvas.getContext('2d');c._ctx.scale(2,2);c._w=c._h=canvas.width/2;
 c._t=c._spin=0;c._speech={t:0,next:0,env:0,count:0,pulses:[],spikes:[]};c._sessions=[];
 c._buildSheetField();return c;
});
window.jarvisPreview={cards,audio};
let last=performance.now(),report=last,frames=0,cost=0, worst=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const start=performance.now();
 for(const c of cards){const cur={speech:audio.paused?0:1,bright:1.7};c._t+=dt;c._spin+=dt*.1;c._speechTick(dt);c._ctx.clearRect(0,0,c._w,c._h);c._drawIm3(dt,c._ctx,c._w/2,c._h/2,c._w/2,cur,c._speech.env,95,232,220);}
 const ms=performance.now()-start;cost+=ms;worst=Math.max(worst,ms);
 if(++frames%30===0){document.querySelector('#status').textContent=`${audio.paused?'Idle / paused':'Playing'} · ${audio.currentTime.toFixed(2)} s · ${cards[0]._membrane?'3D membranes':'Canvas fallback'} · waveform ${cards[0]._env?'ready':'—'} · ${(30000/(now-report)).toFixed(0)} fps · draw ${(cost/frames).toFixed(1)} ms / frame (two sizes) · max ${worst.toFixed(1)} ms`;report=now;document.querySelector('#meter').style.width=`${cards[0]._speech.env*100}%`;}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
async function play(url){audio.src=url;for(const c of cards)c._trackSpeech(audio,url);audio.onended=()=>cards.forEach(c=>c._releaseSpeech(audio));await audio.play();}
document.querySelector('#speech').onclick=()=>play('./speech.mp3');
document.querySelector('#file').onchange=e=>play(URL.createObjectURL(e.target.files[0]));
document.querySelector('#pause').onclick=()=>audio.paused?audio.play():audio.pause();
document.querySelector('#idle').onclick=()=>{audio.pause();cards.forEach(c=>{c._releaseSpeech(audio);c._boot=null;});};
document.querySelector('#boot').onclick=()=>cards.forEach(c=>{c._boot={t:0};c._config.assistant_name='Jarvis';});
document.querySelector('#sessions').onclick=()=>cards.forEach(c=>{c._sessions=c._sessions.length?[]:[{id:'one',context:64000,context_max:200000,busy:true},{id:'two',context:158000,context_max:200000,done:true},{id:'three',context:20000,context_max:200000}];});
window.addEventListener('error',e=>document.querySelector('#status').textContent=e.message);
</script></html>
